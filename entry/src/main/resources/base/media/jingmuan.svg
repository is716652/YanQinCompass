<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 井木犴（南方朱雀第一宿，狴犴状瑞兽）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：狴犴蹲坐，颈有鬣毛，头生小角
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影 -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -130 130 q60 -10 260 0"/>
    </g>

    <!-- 后腿（蹲踞） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <!-- 左后腿 -->
      <path d="M -60 40
               C -90 70  -100 110  -80 124
               C -65 132  -45 130  -38 122"/>
      <!-- 左爪（阔掌三趾） -->
      <path d="M -80 124
               C -98 130 -108 132 -114 134
               M -114 134 l -10 6
               M -114 134 l -4 12
               M -114 134 l  4 12"/>
      <!-- 右后腿 -->
      <path d="M  40 40
               C  72 60   92 100   82 122
               C  74 132  56 130   48 122"/>
      <!-- 右爪 -->
      <path d="M 82 122
               C 100 128 110 132 116 134
               M 116 134 l 10 4
               M 116 134 l 6 12
               M 116 134 l -2 12"/>
    </g>

    <!-- 身躯（粗壮） -->
    <path d="M -70 -20
             C -90 10  -90  60  -60  70
             C -30  78   30  78   60  70
             C  90  60   90  10   70 -20
             C  60 -36   40 -42   20 -42
             C -10 -42  -50 -40  -70 -20 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 胸腹鳞/卷毛 -->
    <g stroke-width="1.6" opacity="0.85">
      <path d="M -30 40 q12 -6 24 4"/>
      <path d="M -30 54 q12 -6 24 4"/>
      <path d="M -10 14 q12 -6 24 4"/>
    </g>

    <!-- 前左肢（撑地） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M -52 40
               C -78 60  -90 90  -78 110
               C -70 122  -52 122  -42 110"/>
      <!-- 爪 -->
      <path d="M -78 110
               C -92 116 -100 120 -104 124
               M -104 124 l -10 6
               M -104 124 l -4 12
               M -104 124 l  4 12"/>
    </g>

    <!-- 前右肢（抬起，仪态端肃） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M  50 40
               C  66 56   72 70   64 84
               C  58 92   44 92   36 84"/>
      <!-- 爪（阔掌） -->
      <g stroke-width="2">
        <path d="M 64 84 l  4 12"/>
        <path d="M 58 88 l  2 12"/>
        <path d="M 52 90 l -2 12"/>
        <path d="M 46 88 l -6  8"/>
        <path d="M 40 84 l -8  6"/>
      </g>
    </g>

    <!-- 鬣毛（颈后飘扬，多束细线表示） -->
    <g stroke-width="1.6" opacity="0.95">
      <path d="M -56 -32 q -18 -10 -22 -30"/>
      <path d="M -46 -38 q -16 -16 -14 -34"/>
      <path d="M -34 -42 q -10 -20  -4 -38"/>
      <path d="M -20 -44 q  -2 -20   4 -38"/>
      <path d="M  -4 -44 q   4 -20  10 -38"/>
      <path d="M  12 -42 q  10 -20  14 -36"/>
      <path d="M  28 -38 q  16 -16  18 -32"/>
      <path d="M  44 -32 q  20 -10  24 -28"/>
      <!-- 鬣毛内层阴影线 -->
      <path d="M -40 -28 q -10 -6 -12 -18" stroke-width="1" opacity="0.6"/>
      <path d="M -20 -32 q  -2 -8   2 -20" stroke-width="1" opacity="0.6"/>
      <path d="M   0 -34 q   4 -8   8 -20" stroke-width="1" opacity="0.6"/>
      <path d="M  22 -30 q   8 -6  12 -18" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 头部（方脸，狴犴相） -->
    <g transform="translate(-6 -68)">
      <!-- 头型（方形阔口） -->
      <path d="M -42 -8
               C -48 -28  -28 -42  -4 -42
               C  20 -42   40 -30   40 -8
               C  40  18   22  28   0  26
               C -22  28  -42  18  -42 -8 Z"
            stroke-width="3.6" fill="#fbf2d6"/>

      <!-- 头顶小角（两只，圆锥向后） -->
      <g stroke-width="2.4" fill="#fbf2d6">
        <path d="M -22 -36
                 C -28 -52  -36 -56  -42 -54
                 C -38 -42  -32 -34  -22 -32 Z"/>
        <path d="M  22 -36
                 C  28 -52   36 -56   42 -54
                 C  38 -42   32 -34   22 -32 Z"/>
        <!-- 角纹 -->
        <path d="M -36 -50 l 4 -3" stroke-width="1"/>
        <path d="M -34 -44 l 4 -3" stroke-width="1"/>
        <path d="M  36 -50 l -4 -3" stroke-width="1"/>
        <path d="M  34 -44 l -4 -3" stroke-width="1"/>
      </g>

      <!-- 眉骨（突出，怒相） -->
      <path d="M -32 -14 q 14 -8 28 -2" stroke-width="2.4"/>

      <!-- 圆眼（狮眼） -->
      <circle cx="-16" cy="-8" r="4.2" fill="#1d1308"/>
      <circle cx="-14" cy="-10" r="1.2" fill="#fbf2d6"/>
      <circle cx=" 14" cy="-8" r="4.2" fill="#1d1308"/>
      <circle cx=" 16" cy="-10" r="1.2" fill="#fbf2d6"/>

      <!-- 鼻（宽） -->
      <path d="M -8 6 q 8 8 16 0" stroke-width="2"/>
      <!-- 鼻孔两点 -->
      <circle cx="-4" cy="9" r="1.2" fill="#1d1308"/>
      <circle cx=" 6" cy="9" r="1.2" fill="#1d1308"/>

      <!-- 嘴（阔，平） -->
      <path d="M -22 16 Q 0 22 22 16" stroke-width="2.4" fill="#7a1f15" fill-opacity="0.12"/>
      <!-- 唇下轮廓（强调方颌） -->
      <path d="M -28 18 q 28 14 56 0" stroke-width="1.4" opacity="0.7"/>

      <!-- 耳（小，贴脑侧） -->
      <path d="M -38 -22 q -8 -2 -8 6 q 4 6 10 4 Z" stroke-width="2" fill="#fbf2d6"/>
      <path d="M  38 -22 q  8 -2  8 6 q -4 6 -10 4 Z" stroke-width="2" fill="#fbf2d6"/>
    </g>

    <!-- 一枚圆木印章/铜环（点缀，暗示律法之兽） -->
    <g transform="translate(-130 90)" stroke-width="2.4">
      <circle cx="0" cy="0" r="14" fill="#fbf2d6"/>
      <circle cx="0" cy="0" r="9"  fill="none"/>
      <path d="M -4 -6 l 4 6 l 4 -6" stroke-width="1.6"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">井木犴</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属木　|　神兽为犴</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，井宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">井</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
