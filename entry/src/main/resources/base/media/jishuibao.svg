<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 箕水豹
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：金钱豹（低伏蹲姿，长尾后扬）居中于 (300, 280)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 长尾（自后臀上扬呈 S 形）-->
    <g stroke-width="3.6" fill="#fbf2d6">
      <path d="M  60  20
               C 110  -4  140 -38  138 -78
               C 138 -92 132 -98  124 -90
               C 116 -84 118 -72  120 -60
               C 110 -30  86  -6   60  20 Z"/>
    </g>
    <!-- 尾斑 -->
    <g stroke-width="1.4" fill="#1d1308">
      <ellipse cx="80"  cy="0"  rx="4" ry="3"/>
      <ellipse cx="100" cy="-22" rx="4" ry="3"/>
      <ellipse cx="118" cy="-46" rx="4" ry="3"/>
      <ellipse cx="126" cy="-70" rx="3.5" ry="2.5"/>
    </g>

    <!-- 后腿（蹲屈，肌腱清晰） -->
    <g stroke-width="3.6" fill="#fbf2d6">
      <path d="M   0  40
               C  10  60   8  78  20  94
               L  56  94  L  56  60 Z"/>
      <!-- 后爪 -->
      <path d="M 20 94 l -6 12 m 0 -2 l -4 0 M 30 94 l -2 12 m -2 -2 l 0 2 M 40 94 l 2 12 m 0 -2 l 4 0 M 50 94 l 6 12 m 0 -2 l 4 0"/>
    </g>

    <!-- 身躯（流线型长身） -->
    <path d="M -130  10
             C -142  -8 -120 -32  -80 -40
             C  -30 -48   30 -36   60 -10
             C  80  10   70  44   30  54
             C  -8  62  -60  58  -100  48
             C -122  42 -134  30 -130  10 Z"
          stroke-width="4.2" fill="#fbf2d6"/>

    <!-- 豹斑（成簇的小玫瑰花式圆环） -->
    <g stroke-width="1.4" fill="#1d1308" opacity="0.95">
      <!-- 头肩部簇 -->
      <g transform="translate(-110 -10)">
        <ellipse cx="-6"  cy="-4"  rx="4.5" ry="3.5"/>
        <ellipse cx="6"   cy="6"   rx="3.5" ry="3"/>
        <ellipse cx="-2"  cy="10"  rx="3" ry="2.5"/>
      </g>
      <g transform="translate(-86 -22)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(-60 -32)">
        <ellipse cx="-4" cy="-4" rx="4.5" ry="3.5"/>
        <ellipse cx="6"  cy="4"  rx="3.5" ry="3"/>
        <ellipse cx="0"  cy="10" rx="3" ry="2.5"/>
      </g>
      <g transform="translate(-30 -36)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(0 -32)">
        <ellipse cx="-4" cy="-4" rx="4.5" ry="3.5"/>
        <ellipse cx="6"  cy="4"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(28 -22)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
        <ellipse cx="0"  cy="12" rx="3" ry="2.5"/>
      </g>
      <g transform="translate(50 -4)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
      </g>
      <!-- 体侧簇 -->
      <g transform="translate(-90 18)">
        <ellipse cx="-4" cy="-4" rx="4.5" ry="3.5"/>
        <ellipse cx="6"  cy="4"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(-58 26)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
        <ellipse cx="0"  cy="12" rx="3" ry="2.5"/>
      </g>
      <g transform="translate(-22 32)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(20 30)">
        <ellipse cx="-4" cy="-2" rx="4" ry="3"/>
        <ellipse cx="6"  cy="6"  rx="3.5" ry="3"/>
      </g>
      <g transform="translate(50 22)">
        <ellipse cx="-2" cy="0" rx="4" ry="3"/>
      </g>
    </g>

    <!-- 前腿（双前腿，蹲伏前伸） -->
    <g stroke-width="3.6" fill="#fbf2d6">
      <!-- 左前腿 -->
      <path d="M -60 -2
               C -64 18 -60 36 -68 56
               L -34 56 L -34 12 Z"/>
      <path d="M -68 56 l -6 12 m 0 -2 l -4 0 M -60 56 l -2 12 m -2 -2 l 0 2 M -50 56 l 2 12 m 0 -2 l 4 0 M -40 56 l 6 12 m 0 -2 l 4 0"/>
      <!-- 右前腿 -->
      <path d="M -100 6
               C -106 28 -102 50 -110 70
               L -78 70 L -78 18 Z"/>
      <path d="M -110 70 l -6 12 m 0 -2 l -4 0 M -102 70 l -2 12 m -2 -2 l 0 2 M -92 70 l 2 12 m 0 -2 l 4 0 M -82 70 l 6 12 m 0 -2 l 4 0"/>
    </g>

    <!-- 头部（左前方，低伏前探） -->
    <g transform="translate(-130 -36)">
      <!-- 头型（椭圆略扁） -->
      <path d="M -38  10
               C -48 -10  -22 -28  10 -28
               C  36 -28  50 -12   50  10
               C  50  24   36  32   18  32
               C  -2  34 -22  30  -38  10 Z"
            stroke-width="3.6" fill="#fbf2d6"/>

      <!-- 圆耳两枚（短圆） -->
      <path d="M -28 -24 q -12 -2 -14 6 q 4 12 16 8 z" stroke-width="2.6" fill="#fbf2d6"/>
      <path d="M  22 -24 q  12 -2  14 6 q -4 12 -16 8 z" stroke-width="2.6" fill="#fbf2d6"/>
      <path d="M -28 -22 q -8 0 -8 6 q 4 8 10 4 z" stroke-width="1.2" fill="#a8362a" opacity="0.55"/>
      <path d="M  22 -22 q  8 0  8 6 q -4 8 -10 4 z" stroke-width="1.2" fill="#a8362a" opacity="0.55"/>

      <!-- 眉骨 -->
      <path d="M -22 -10 q 12 -8 26 0" stroke-width="2"/>
      <path d="M  10 -10 q 12 -8 26 0" stroke-width="2"/>

      <!-- 眼（圆睛凶光） -->
      <circle cx="-8"  cy="-2" r="4" fill="#fbf2d6" stroke="#1d1308" stroke-width="2"/>
      <circle cx="-8"  cy="-2" r="2" fill="#1d1308"/>
      <circle cx="22"  cy="-2" r="4" fill="#fbf2d6" stroke="#1d1308" stroke-width="2"/>
      <circle cx="22"  cy="-2" r="2" fill="#1d1308"/>

      <!-- 鼻头（小三角黑）-->
      <path d="M 2 10 q 6 -2 10 0 q 4 4 -2 6 q -8 2 -10 -2 q -2 -2 2 -4 Z" stroke-width="1.4" fill="#1d1308"/>

      <!-- 嘴线（紧闭冷笑） -->
      <path d="M 6 18 q 6 6 16 0" stroke-width="1.6"/>

      <!-- 颊须 -->
      <g stroke-width="0.9" opacity="0.7">
        <path d="M -22 14 q -14 0 -22 4"/>
        <path d="M -22 20 q -14 4 -22 12"/>
        <path d="M  36 14 q 12 0 20 6"/>
        <path d="M  36 20 q 12 4 20 12"/>
      </g>

      <!-- 颊侧斑点（小） -->
      <g stroke-width="1" fill="#1d1308" opacity="0.85">
        <ellipse cx="-20" cy="6" rx="2.5" ry="2"/>
        <ellipse cx="32"  cy="6" rx="2.5" ry="2"/>
        <ellipse cx="6" cy="-22" rx="2" ry="1.6"/>
      </g>
    </g>

    <!-- 地面上淡波纹（水宿象征） -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.3" fill="none">
      <path d="M-130 110 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0"/>
      <path d="M-130 122 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0 q 10 -6 20 0"/>
    </g>
  </g>

  <!-- ⑥ 题款区 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">箕水豹</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属水　|　神兽为豹</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">东　方　青　龙　七　宿</text>

  <!-- ⑦ 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">箕</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
