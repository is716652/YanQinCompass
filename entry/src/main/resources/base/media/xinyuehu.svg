<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 心月狐
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：灵狐（坐姿警觉，尖耳尖嘴大尾）居中于 (300, 280)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 大尾巴（蓬松卷向左上，分段弧线表示毛流）-->
    <g stroke-width="3.6" fill="#fbf2d6">
      <path d="M  60 60
               C 110 30  150 -10 130 -60
               C 110 -100  50 -100   20 -70
               C  10 -56   30 -36   50 -40
               C  70 -42   80 -20   60  -8
               C  44   2   46  30   60  60 Z"/>
    </g>
    <!-- 尾梢白尖 -->
    <path d="M 122 -56 q 14 -10 16 -28 q -2 -10 -12 -10 q -10 4 -10 16 q -2 12 6 22 Z"
          stroke-width="2.4" fill="#fbf2d6"/>
    <!-- 尾巴毛流（细弧线）-->
    <g stroke-width="1.2" opacity="0.7">
      <path d="M  60 -50 q 20 0 30 14"/>
      <path d="M  90 -70 q 14 16 4 36"/>
      <path d="M 120 -50 q  0 18 -18 30"/>
      <path d="M  50 -10 q 18 -2 24 8"/>
      <path d="M  70  30 q 14 0 22 6"/>
    </g>

    <!-- 后腿（坐姿前伸的两条腿） -->
    <g stroke-width="3" fill="#fbf2d6">
      <!-- 左后腿 -->
      <path d="M -50 60 C -56 80 -54 100 -58 118 L -28 118 L -28 80 Z"/>
      <!-- 右后腿 -->
      <path d="M  20 70 C  24 90  22 110  28 124 L  56 124 L  56 80 Z"/>
    </g>
    <!-- 爪垫 -->
    <g stroke-width="1.2" fill="#fbf2d6">
      <path d="M -58 118 l 0 6 M -50 118 l 0 7 M -42 118 l 0 7 M -32 118 l 0 6"/>
      <path d="M  28 124 l 0 6 M  36 124 l 0 7 M  44 124 l 0 7 M  54 124 l 0 6"/>
    </g>

    <!-- 身躯（修长优雅） -->
    <path d="M -70  20
             C -78  -6 -50 -30  -20 -30
             C   8 -28   30 -10   36  20
             C  42  52   24  80   -8  88
             C -42  92 -70  70  -70  20 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 胸腹弧线（暗示身段） -->
    <path d="M -50 30 q 30 24 70 0" stroke-width="1.6" opacity="0.55"/>

    <!-- 前腿（细长，坐在胸前） -->
    <g stroke-width="2.6" fill="#fbf2d6">
      <path d="M -30 30 C -34 50 -32 66 -38 78 L -16 78 L -16 50 Z"/>
      <path d="M  10 32 C  14 52  12 68  18 80 L  40 80 L  40 50 Z"/>
    </g>
    <!-- 前爪指节 -->
    <g stroke-width="1" fill="none">
      <path d="M -36 78 l 0 5 M -28 78 l 0 6 M -20 78 l 0 5"/>
      <path d="M  20 80 l 0 5 M  28 80 l 0 6 M  36 80 l 0 5"/>
    </g>

    <!-- 头部（尖嘴锥形面，朝左前方） -->
    <g transform="translate(-50 -60)">
      <!-- 三角尖耳两枚（狐耳特征） -->
      <path d="M -28 -28 L -42 -58 L -10 -42 Z" stroke-width="2.6" fill="#fbf2d6"/>
      <path d="M  18 -28 L  32 -58 L   0 -42 Z" stroke-width="2.6" fill="#fbf2d6"/>
      <!-- 耳内粉 -->
      <path d="M -28 -32 L -36 -50 L -16 -42 Z" stroke-width="1.2" fill="#a8362a" opacity="0.55"/>
      <path d="M  18 -32 L  26 -50 L   6 -42 Z" stroke-width="1.2" fill="#a8362a" opacity="0.55"/>

      <!-- 头型（细长尖嘴） -->
      <path d="M -32  -2
               C -36 -22  -10 -34   16 -32
               C  34 -32  48 -22   52  -2
               C  54  10   40  18   22  18
               C   8  20  -6  22  -18  18
               C -28  16 -34   8  -32  -2 Z"
            stroke-width="3.4" fill="#fbf2d6"/>

      <!-- 眉骨 -->
      <path d="M -10 -16 q 10 -4 18 0" stroke-width="1.8"/>
      <path d="M  18 -16 q 10 -4 18 0" stroke-width="1.8"/>

      <!-- 眼睛（细长挑眼） -->
      <path d="M -12 -8 q 10 -6 20 0 q -10 4 -20 0 Z" stroke-width="1.4" fill="#1d1308"/>
      <circle cx="-2" cy="-9" r="1" fill="#fbf2d6"/>
      <path d="M 12 -8 q 10 -6 20 0 q -10 4 -20 0 Z" stroke-width="1.4" fill="#1d1308"/>
      <circle cx="22" cy="-9" r="1" fill="#fbf2d6"/>

      <!-- 鼻尖（小巧） -->
      <path d="M 46 0 q 6 -2 8 4 q -2 6 -8 4 q -4 -2 0 -8 Z" stroke-width="1.4" fill="#1d1308"/>

      <!-- 嘴线（狐媚细线） -->
      <path d="M 46 6 q -6 6 -16 4" stroke-width="1.6"/>
      <path d="M 46 6 q  0 6  6 6"  stroke-width="1.4"/>

      <!-- 颊须 -->
      <g stroke-width="0.9" opacity="0.7">
        <path d="M  0 6 q -10 6 -18 14"/>
        <path d="M  0 10 q -10 8 -16 18"/>
        <path d="M 38 8 q 10 4 18 12"/>
      </g>

      <!-- 额部白纹（灵狐标志） -->
      <path d="M 4 -30 q 10 -6 18 0" stroke-width="1.2" opacity="0.7"/>
    </g>

    <!-- 身上绒毛（短笔触） -->
    <g stroke-width="0.9" opacity="0.45">
      <path d="M -50 -10 q 4 -4 8 0"/>
      <path d="M -20 -20 q 4 -4 8 0"/>
      <path d="M  20 -10 q 4 -4 8 0"/>
      <path d="M -50  40 q 4 -4 8 0"/>
      <path d="M -10  60 q 4 -4 8 0"/>
      <path d="M  30  40 q 4 -4 8 0"/>
    </g>
  </g>

  <!-- ⑥ 题款区 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">心月狐</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属月　|　神兽为狐</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">东　方　青　龙　七　宿</text>

  <!-- ⑦ 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">心</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
