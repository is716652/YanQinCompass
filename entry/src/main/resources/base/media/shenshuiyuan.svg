<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 参水猿（西方白虎第七宿，长臂无尾灵长）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：长臂猿悬吊于树枝
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 树枝（横亘上方，供猿悬挂） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M -170 -90
               C -110 -100  -40 -96  30 -94
               C  90  -92  140 -88  170 -82"/>
      <!-- 树皮纹 -->
      <g stroke-width="1" opacity="0.7">
        <path d="M -140 -94 q 6 4 12 0"/>
        <path d="M -80  -96 q 6 4 12 0"/>
        <path d="M  -8  -94 q 6 4 12 0"/>
        <path d="M  70  -92 q 6 4 12 0"/>
        <path d="M 130  -86 q 6 4 12 0"/>
      </g>
      <!-- 一片小叶（左端） -->
      <path d="M -160 -92 q -14 -10 -22 -4 q 6 12 22 8 Z" stroke-width="2" fill="#fbf2d6"/>
      <!-- 一片小叶（右端） -->
      <path d="M 160 -84 q 14 -10 22 -4 q -6 12 -22 8 Z" stroke-width="2" fill="#fbf2d6"/>
    </g>

    <!-- 悬吊的左长臂（左臂特长，从肩斜下至树枝抓握） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M -38 -50
               C -50 -20  -78  -8  -110  0
               C -130  4  -140 -10  -138 -22
               C -136 -36  -126 -42  -114 -38"/>
      <!-- 左手长指（抓握树枝） -->
      <g stroke-width="2">
        <path d="M -138 -22 q -2 6  2 10"/>
        <path d="M -132 -28 q  0 6  4 10"/>
        <path d="M -126 -34 q  2 6  6 10"/>
        <path d="M -120 -38 q  4 6  8 10"/>
      </g>
    </g>

    <!-- 悬吊的右长臂（更明显特长，甩向斜下方） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M  44 -50
               C  62  -8   86  20   80  60
               C  74  80   52  92    34  86
               C  18  80   10  64    18  48
               C  22  36   30  30    40  30"/>
      <!-- 右手（张开五指） -->
      <g stroke-width="2">
        <path d="M 40 30 l  2 14"/>
        <path d="M 32 30 l -2 14"/>
        <path d="M 24 32 l -6 12"/>
        <path d="M 16 36 l -10 10"/>
        <path d="M 10 42 l -12  6"/>
      </g>
    </g>

    <!-- 身躯（修长，倒挂呈 U 形） -->
    <path d="M -42 -50
             C -52 -22  -52   8  -42  30
             C -28  50  -8  58   10  56
             C  30  54   46  42   50  26
             C  52  10   48  -8   44 -50 Z"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 胸腹淡毛纹 -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -22  0  q 10 -4  20 2"/>
      <path d="M -22 14  q 10 -4  20 2"/>
      <path d="M -18 28  q 10 -4  20 2"/>
    </g>

    <!-- 蜷曲的双腿（短小，因为是猿不是猴） -->
    <g stroke-width="3" fill="#fbf2d6">
      <!-- 左腿弯曲 -->
      <path d="M -16 50
               C -30 70  -42 86  -30 100
               C -18 110  0 100   6  88"/>
      <!-- 左脚（长趾） -->
      <g stroke-width="2">
        <path d="M -30 100 l -8 4"/>
        <path d="M -24 106 l -8 4"/>
        <path d="M -18 110 l -8 2"/>
        <path d="M -12 110 l -6  0"/>
      </g>
      <!-- 右腿弯曲 -->
      <path d="M  10 50
               C  18 72   20 88   36  92
               C  50  94   56  82   50  70"/>
      <!-- 右脚（长趾） -->
      <g stroke-width="2">
        <path d="M 36 92 l  8 4"/>
        <path d="M 42 92 l  8 2"/>
        <path d="M 48 86 l  8 0"/>
        <path d="M 52 78 l  6 -2"/>
      </g>
    </g>

    <!-- 头部（圆润，长脸人相） -->
    <g transform="translate(2 -78)">
      <!-- 头型（椭圆，比猴更狭长） -->
      <path d="M -30 -10
               C -36 -32  -16 -44   4 -42
               C  24 -44   34 -30   30 -10
               C  28   8   14  18  -4  16
               C -22  16  -32   6  -30 -10 Z"
            stroke-width="3.2" fill="#fbf2d6"/>

      <!-- 头顶正中一道冠毛（猿特征） -->
      <path d="M -2 -42 q 0 -12 6 -16 q 6  4 4 14"
            stroke-width="1.8"/>

      <!-- 眉骨 -->
      <path d="M -22 -10 q 10 -6 20 -2" stroke-width="2"/>
      <!-- 大眼（猿眼更近人） -->
      <circle cx="-12" cy="-6" r="3.8" fill="#1d1308"/>
      <circle cx="-10" cy="-8" r="1.1" fill="#fbf2d6"/>
      <circle cx=" 12" cy="-6" r="3.8" fill="#1d1308"/>
      <circle cx=" 14" cy="-8" r="1.1" fill="#fbf2d6"/>

      <!-- 小鼻（人相扁平） -->
      <path d="M -2 4 q 2 4 4 0" stroke-width="1.4"/>
      <!-- 嘴（抿起，下颌轮廓） -->
      <path d="M -6 12 q 6 4 12 0" stroke-width="2"/>
      <!-- 下颌弧线 -->
      <path d="M -22 6 q 12 16 30 4" stroke-width="1.4" opacity="0.7"/>

      <!-- 耳（小，圆，在侧面） -->
      <path d="M -32 -16 q -6 -2 -6 6 q 2 6 8 4" stroke-width="2" fill="#fbf2d6"/>
      <path d="M  30 -16 q  6 -2  6 6 q -2 6 -8 4" stroke-width="2" fill="#fbf2d6"/>

      <!-- 颊侧毛（猿毛长） -->
      <g stroke-width="1.4" opacity="0.85">
        <path d="M -34 -2 q -10 4 -10 14"/>
        <path d="M -36  4 q -12 6 -10 16"/>
        <path d="M  34 -2 q  10 4  10 14"/>
        <path d="M  36  4 q  12 6  10 16"/>
      </g>
    </g>

    <!-- 一缕月辉/星点（点缀，暗示参宿三星） -->
    <g fill="#1d1308" stroke="none">
      <circle cx="-90"  cy="-110" r="2.2"/>
      <circle cx="-72"  cy="-128" r="2.6"/>
      <circle cx="-58"  cy="-112" r="2"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">参水猿</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属水　|　神兽为猿</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">西　方　白　虎　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，参宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">参</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
