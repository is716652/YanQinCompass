<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 鬼金羊（南方朱雀第二宿，山羊瑞相）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：山羊，侧身立姿，弯角卷毛
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影 -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -110 120 q60 -10 220 0"/>
    </g>

    <!-- 后腿（右后） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M 60 20
               C 76 50  80 90  72 110
               C 68 120 56 122 50 116"/>
      <!-- 偶蹄 -->
      <path d="M 50 116
               C 50 124 48 130 44 134
               M 44 134 l -6 4 m 0 -2 l -4 2
               M 50 116
               C 56 122 58 130 56 134
               M 56 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 前腿（左前） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M -40 30
               C -38 60  -34 90  -32 110
               C -32 122  -22 124  -16 118"/>
      <!-- 偶蹄 -->
      <path d="M -16 118
               C -16 126 -18 130 -22 134
               M -22 134 l -6 4 m 0 -2 l -4 2
               M -16 118
               C -10 124 -8 130 -10 134
               M -10 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 前腿（右前） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M 24 28
               C 28 58  32 92  32 112
               C 32 122  42 124  46 118"/>
      <path d="M 46 118
               C 46 126 44 130 40 134
               M 40 134 l -6 4 m 0 -2 l -4 2
               M 46 118
               C 52 124 54 130 52 134
               M 52 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 身躯（圆浑羊毛轮廓） -->
    <path d="M -60 -10
             C -78 12  -78  48  -50  56
             C -20  62   30  60   60  50
             C  88  38   90  -2   72 -20
             C  56 -36   30 -42    0 -42
             C -28 -42  -52 -34  -60 -10 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 羊毛卷云纹（密集小弧，铺满躯干） -->
    <g stroke-width="1.4" opacity="0.9">
      <path d="M -50 0  q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -56 16 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -50 32 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -30 -8 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -28  8 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -26 24 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M -22 40 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M   0 -16 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M   2   0 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M   2  16 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M   4  32 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M  30  -8 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M  30   8 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M  30  24 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M  56   0 q 6 -6 12 0 q 6 6 12 0"/>
      <path d="M  60  14 q 6 -6 12 0 q 6 6 12 0"/>
    </g>

    <!-- 尾巴（短小上翘） -->
    <path d="M -64 8 q -16 -2 -22 -14 q 4 -6 10 -4"
          stroke-width="2.6" fill="#fbf2d6"/>

    <!-- 头部（侧身朝左，长脸） -->
    <g transform="translate(-50 -42)">
      <!-- 长脸 -->
      <path d="M  8  -22
               C  -2  -38  -28  -38  -42  -28
               C -56  -18  -56   0  -50   8
               C -42  18  -28  20  -16  14
               C  -6  10    6   4   12  -8
               C  16 -14   14 -20    8 -22 Z"
            stroke-width="3.4" fill="#fbf2d6"/>

      <!-- 左弯角（向后卷大弧） -->
      <g stroke-width="3" fill="#fbf2d6">
        <path d="M -10 -36
                 C -22 -56  -44 -64  -56 -52
                 C -64 -42  -56 -30  -42 -28
                 C -30 -26  -22 -30  -16 -34"/>
        <!-- 角纹环 -->
        <path d="M -28 -54 q 4 -4 8 0" stroke-width="1.2"/>
        <path d="M -42 -58 q 4 -4 8 0" stroke-width="1.2"/>
        <path d="M -52 -50 q 4 -2 8 0"  stroke-width="1.2"/>
      </g>

      <!-- 右弯角（向后卷，镜像） -->
      <g stroke-width="3" fill="#fbf2d6">
        <path d="M  10 -34
                 C  22 -56   44 -64   56 -52
                 C  64 -42   56 -30   42 -28
                 C  30 -26   22 -30   16 -34"/>
        <path d="M  28 -54 q -4 -4 -8 0" stroke-width="1.2"/>
        <path d="M  42 -58 q -4 -4 -8 0" stroke-width="1.2"/>
        <path d="M  52 -50 q -4 -2 -8 0" stroke-width="1.2"/>
      </g>

      <!-- 额毛 -->
      <g stroke-width="1.4" opacity="0.85">
        <path d="M -20 -22 q 0 -8 6 -10"/>
        <path d="M -10 -26 q 0 -10 6 -12"/>
        <path d="M   2 -26 q 0 -10 6 -12"/>
      </g>

      <!-- 横瞳（羊相，水平狭长） -->
      <ellipse cx="-30" cy="-12" rx="5" ry="2.6" fill="#1d1308"/>
      <circle cx="-30" cy="-12" r="0.9" fill="#fbf2d6"/>

      <!-- 鼻 -->
      <path d="M -44 -2 q 6 -2 8 4" stroke-width="1.6"/>
      <!-- 鼻孔 -->
      <circle cx="-42" cy="0" r="1" fill="#1d1308"/>
      <circle cx="-38" cy="2" r="1" fill="#1d1308"/>

      <!-- 嘴（抿） -->
      <path d="M -48 6 q 6 4 12 0" stroke-width="1.8"/>

      <!-- 山羊须（颌下） -->
      <g stroke-width="1.8" fill="#fbf2d6">
        <path d="M -36 16 q -4 14 -8 22"/>
        <path d="M -28 18 q -2 14 -4 24"/>
        <path d="M -20 18 q  2 12  0 22"/>
      </g>

      <!-- 耳（小，朝后下） -->
      <path d="M 4 -14 q 12 -2 14 6 q -6 6 -14 4 Z" stroke-width="2" fill="#fbf2d6"/>
      <path d="M 8 -10 q 6 0 8 4" stroke-width="1.2"/>
    </g>

    <!-- 颈下飘毛（一缕长毛） -->
    <g stroke-width="1.8" opacity="0.9">
      <path d="M -40 -22 q -6 6 -2 14"/>
      <path d="M -32 -16 q -4 8   2 16"/>
      <path d="M -24 -10 q  0 6   6 14"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">鬼金羊</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属金　|　神兽为羊</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，鬼宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">鬼</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
