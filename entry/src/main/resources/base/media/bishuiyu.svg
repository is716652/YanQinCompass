<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 壁水貐（北方玄武第五宿）
      画布 600x600；所有坐标相对于 viewBox。
      风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- 貐：豹身 + 小角 + 獠牙 + 鳞斑 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面纹理（远雾） -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.30" fill="none">
      <path d="M-150 120 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M-150 -110 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <!-- 长尾（豹尾，有环节） -->
    <path d="M  80 30
             C 110 30   130 10   140 -20
             C 144 -40  130 -54   110 -50
             C 100 -48   96 -40  104 -34"
          stroke-width="3.4" fill="#fbf2d6"/>
    <!-- 尾环节 -->
    <g stroke-width="2" opacity="0.85">
      <path d="M 100 22 q 8 -4 16 0"/>
      <path d="M 116 6 q 8 -4 16 0"/>
      <path d="M 128 -14 q 6 -6 14 -4"/>
      <path d="M 130 -34 q 4 -6 12 -8"/>
    </g>
    <!-- 尾尖毛丛 -->
    <g stroke-width="1.6">
      <path d="M 104 -34 q -4 -10 0 -18"/>
      <path d="M 108 -34 q  0 -10 6 -16"/>
      <path d="M 112 -34 q  4 -10 12 -14"/>
    </g>

    <!-- 身躯（修长，蹲伏欲扑） -->
    <path d="M -90 20
             C -90 -10  -60 -22  -20 -22
             C  20 -22   60 -10   80  10
             C  92  28   84  52   60  62
             C  20  72  -20  72  -60  60
             C -90  50  -94  36  -90  20 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 鳞斑（豹点） -->
    <g stroke-width="1.4" fill="#1d1308" opacity="0.85">
      <circle cx="-50" cy="0"  r="3.2"/>
      <circle cx="-30" cy="14" r="3.2"/>
      <circle cx="-10" cy="-4" r="3.2"/>
      <circle cx=" 10" cy="10" r="3.2"/>
      <circle cx=" 30" cy="-6" r="3.2"/>
      <circle cx=" 50" cy="14" r="3.2"/>
      <circle cx="-44" cy="30" r="3.2"/>
      <circle cx="-20" cy="40" r="3.2"/>
      <circle cx="  6" cy="36" r="3.2"/>
      <circle cx=" 32" cy="42" r="3.2"/>
      <circle cx=" 56" cy="34" r="3.2"/>
    </g>

    <!-- 鳞纹边线 -->
    <g stroke-width="1.2" opacity="0.6">
      <path d="M -70 -10 q 10 4 18 0"/>
      <path d="M -30 -14 q 10 4 18 0"/>
      <path d="M  10 -14 q 10 4 18 0"/>
      <path d="M  50 -10 q 10 4 18 0"/>
    </g>

    <!-- 后腿（蹲姿） -->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M -50 60
               C -50 78  -46 96  -42 110
               M -42 110 l -10 6 m 0 -2 l -4 2
               M -42 110 l   8 8 m 0 -2 l  4 2"/>
      <path d="M  60 56
               C  62 74   66 92   70 106
               M 70 106 l -10 6 m 0 -2 l -4 2
               M 70 106 l   8 8 m 0 -2 l  4 2"/>
    </g>

    <!-- 前腿（撑起，弯曲） -->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M -60 50
               C -62 60  -54 68  -46 76
               C -42 82  -42 90  -46 100
               M -46 100 l -10 4 m 0 -2 l -4 2
               M -46 100 l   8 6 m 0 -2 l  4 2"/>
      <path d="M  20 64
               C  18 76   24 86   30 96
               M 30 96 l -8 4 m 0 -2 l -4 2
               M 30 96 l  10 6 m 0 -2 l  4 2"/>
    </g>

    <!-- 头部（左前方，仰首咆哮） -->
    <g transform="translate(-70 -10)">
      <!-- 头型（豹首，偏方） -->
      <path d="M -52 0
               C -56 -22  -42 -38  -22 -42
               C   0 -46   18 -36   22 -16
               C   26   2   16  14   -4  14
               C  -22  14 -42   8  -52   0 Z"
            stroke-width="3.4" fill="#fbf2d6"/>

      <!-- 左小角（向后） -->
      <path d="M -36 -36
               L -52 -56
               L -28 -42 Z"
            stroke-width="2.4" fill="#fbf2d6"/>
      <!-- 角纹 -->
      <path d="M -38 -42 l -4 -8" stroke-width="1.2"/>

      <!-- 右小角 -->
      <path d="M  -8 -42
               L  -2 -62
               L  10 -38 Z"
            stroke-width="2.4" fill="#fbf2d6"/>
      <path d="M 2 -46 l 2 -10" stroke-width="1.2"/>

      <!-- 耳（短圆） -->
      <path d="M -28 -30 q -10 -10 -2 -16 q 8 -4 10 6 Z"
            stroke-width="2.4" fill="#fbf2d6"/>
      <path d="M 10 -32 q 12 -8 14 4 q 0 8 -10 6 Z"
            stroke-width="2.4" fill="#fbf2d6"/>

      <!-- 怒眉 -->
      <path d="M -32 -22 q 10 -8 22 -2" stroke-width="2.4"/>
      <path d="M -2 -22 q 10 -6 22 2"  stroke-width="2.4"/>

      <!-- 圆睛凶光 -->
      <circle cx="-16" cy="-14" r="4.6" fill="#1d1308"/>
      <circle cx="-15" cy="-16" r="1.4" fill="#fbf2d6"/>
      <circle cx=" 12" cy="-10" r="4.6" fill="#1d1308"/>
      <circle cx=" 13" cy="-12" r="1.4" fill="#fbf2d6"/>

      <!-- 鼻头 -->
      <path d="M -28 0 q 4 -6 14 -4" stroke-width="2"/>
      <circle cx="-22" cy="2" r="2" fill="#1d1308"/>

      <!-- 血盆大口（关键特征） -->
      <path d="M -52 6
               Q -30 24  0  22
               Q  20 20  28   8"
            stroke-width="2.6" fill="#7a1f15" fill-opacity="0.18"/>
      <!-- 上獠牙（4 枚） -->
      <path d="M -36 8 l 2 8 l 4 -6
               M -20 14 l 2 10 l 4 -6
               M  -2 18 l 2 10 l 4 -6
               M  16 14 l 2 8 l 4 -6"
            stroke-width="1.6" fill="#fbf2d6"/>
      <!-- 下獠牙（2 枚长牙） -->
      <path d="M -28 16 l 2 -10 l 4 6
               M  10 18 l 2 -10 l 4 6"
            stroke-width="1.6" fill="#fbf2d6"/>

      <!-- 须 -->
      <g stroke-width="1" opacity="0.85">
        <path d="M -50 -4 q -12  2 -20  0"/>
        <path d="M -50  4 q -12  6 -20  4"/>
        <path d="M  24 -2 q 12 -2 22 0"/>
        <path d="M  24  6 q 12  6 22 4"/>
      </g>
    </g>
  </g>

  <!-- 题款 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">壁水貐</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属水　|　神兽为貐</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">北　方　玄　武　七　宿</text>

  <!-- 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">壁</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>