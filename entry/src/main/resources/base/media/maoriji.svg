<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 昴日鸡（西方白虎第四宿）
      画布 600x600；所有坐标相对于 viewBox。
      风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- 鸡：昂首挺立，红冠垂髯镰尾 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面短草 -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.30" fill="none">
      <path d="M-150 120 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M-140 138 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <!-- 镰形长尾羽（核心标志：高高扬起，弯镰刀形） -->
    <g stroke-width="2.8" fill="#fbf2d6">
      <path d="M  40  -30
               C  80 -60  130 -80  150 -110
               C  140 -90  110 -70   80 -50
               C  60 -36   50 -28   40 -30 Z"/>
      <path d="M  36  -10
               C  80 -10  130  -10  150  -10
               C  130 -14  100 -16   70 -16
               C  50 -16   42 -14   36 -10 Z"/>
      <path d="M  40   10
               C  80  10  120  20  140  36
               C  120  20   90  14   60   8
               C  48   6   42   6    40  10 Z"/>
    </g>
    <!-- 尾羽细纹 -->
    <g stroke-width="1.2" opacity="0.7">
      <path d="M 70 -50 q 14 -10 28 -22"/>
      <path d="M 90 -42 q 14 -12 28 -22"/>
      <path d="M 110 -38 q 12 -10 22 -18"/>
    </g>

    <!-- 身躯（胸挺肚圆） -->
    <path d="M -40 -20
             C -42 -50  -10 -60   20 -56
             C  50 -52   72 -38   74 -10
             C  76  18   60  44   30  50
             C   0  56  -30  50  -44  34
             C -54  18  -54   0  -40 -20 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 翼羽（贴在身侧） -->
    <g stroke-width="2" fill="#fbf2d6">
      <path d="M -10 -28 q 30 0  50 12 q -28 6 -50 0 Z"/>
    </g>
    <!-- 翼羽纹 -->
    <g stroke-width="1.2" opacity="0.85">
      <path d="M 4 -22 q 12 -4 24 -2"/>
      <path d="M 6 -14 q 14 -4 26 -2"/>
      <path d="M 8  -6 q 16 -4 28 -2"/>
    </g>

    <!-- 胸腹鳞羽 -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -34 0 q 14 8 30 0"/>
      <path d="M -32 14 q 14 8 30 0"/>
      <path d="M -28 26 q 14 8 28 0"/>
    </g>
    <g stroke-width="1" fill="#1d1308" opacity="0.85">
      <ellipse cx="-22" cy="2"  rx="2" ry="1.4"/>
      <ellipse cx=" -8" cy="6"  rx="2" ry="1.4"/>
      <ellipse cx="  8" cy="10" rx="2" ry="1.4"/>
      <ellipse cx="-20" cy="16" rx="2" ry="1.4"/>
      <ellipse cx=" -6" cy="20" rx="2" ry="1.4"/>
      <ellipse cx=" 10" cy="24" rx="2" ry="1.4"/>
    </g>

    <!-- 双腿（强健立姿，带距） -->
    <g stroke-width="2.6" fill="#fbf2d6">
      <!-- 左腿 -->
      <path d="M -10 50 C -10 70 -12 88 -14 102
               M -14 102 l -10 4 m 0 -2 l -4 2
               M -14 102 l   6 6"/>
      <!-- 右腿 -->
      <path d="M  20 50 C  20 70  22 88  24 102
               M  24 102 l -10 4 m 0 -2 l -4 2
               M  24 102 l   6 6"/>
      <!-- 左距（后方尖突） -->
      <path d="M -14 90 l -8 4" stroke-width="1.6"/>
      <!-- 右距 -->
      <path d="M 24 90 l 8 4" stroke-width="1.6"/>
    </g>

    <!-- 颈羽（飘逸） -->
    <g stroke-width="1.6" opacity="0.85">
      <path d="M -20 -52 q 6 -12 14 -12"/>
      <path d="M  -4 -56 q 6 -14 14 -14"/>
      <path d="M  12 -56 q 6 -14 14 -14"/>
    </g>

    <!-- 头部（昂首朝左上方） -->
    <g transform="translate(-10 -70)">
      <!-- 头型 -->
      <path d="M -10 0
               C -16 -16    4 -22   20 -16
               C  30 -10   28   4   18   6
               C   2   8  -10   4  -10   0 Z"
            stroke-width="3" fill="#fbf2d6"/>

      <!-- 红鸡冠（锯齿三角顶） -->
      <g stroke-width="2.4" fill="#a8362a">
        <path d="M -8 -16
                 l 4 -12 l 6 12 l 6 -14 l 6 14 l 6 -12 l 6 12
                 l -2 4 Z"/>
      </g>

      <!-- 圆眼 -->
      <circle cx="6" cy="-6" r="3" fill="#1d1308"/>
      <circle cx="7" cy="-7" r="1" fill="#fbf2d6"/>

      <!-- 短喙 -->
      <path d="M -10 -2 L -22 -4 L -10 2 Z"
            stroke-width="2" fill="#a8362a"/>

      <!-- 垂髯（下巴小肉垂） -->
      <path d="M -8 8
               q -8 4  -6 12
               q  4  6  10 2
               q  4 -4  2 -10 Z"
            stroke-width="2" fill="#a8362a"/>
    </g>
  </g>

  <!-- 题款 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">昴日鸡</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属日　|　神兽为鸡</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">西　方　白　虎　七　宿</text>

  <!-- 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">昴</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>