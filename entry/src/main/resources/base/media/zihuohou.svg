<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 觜火猴（西方白虎第六宿，工笔淡墨线描）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：坐姿灵猴，长尾蜷卷
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影（淡） -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -110 130 q60 -10 220 0"/>
    </g>

    <!-- 长卷尾（从身后绕到身前再翘起，是最大特征）-->
    <path d="M -55 30
             C -120 40  -160 90  -150 130
             C -135 158  -90 152  -50 130
             C -10 108   30 100   60 70
             C  90  40   95   0   70 -10"
          stroke-width="3.4" fill="#fbf2d6"/>
    <!-- 尾段细梢 -->
    <path d="M 70 -10 q-12 4 -22 -2 q-10 -6 -6 -16"
          stroke-width="2.4"/>
    <!-- 尾鳞/节纹 -->
    <g stroke-width="1" opacity="0.85">
      <path d="M -90  40 q6  4  0 10"/>
      <path d="M -120 60 q6  4  0 10"/>
      <path d="M -148 90 q6  4  0 10"/>
      <path d="M -150 120 q-2 6  -8 6"/>
      <path d="M -120 138 q-2 6  -8 6"/>
      <path d="M -80 130  q-2 6  -8 6"/>
      <path d="M -30 120  q4 6   10 4"/>
      <path d="M  20 100  q4 6   10 4"/>
      <path d="M  60  70  q4 6   10 4"/>
    </g>

    <!-- 后腿（盘坐）-->
    <g stroke-width="3.2" fill="#fbf2d6">
      <!-- 左后腿 -->
      <path d="M -45 30
               C -75 50  -90 90  -70 110
               C -55 120  -30 120  -20 110"/>
      <!-- 右后腿（露出膝头） -->
      <path d="M  20 40
               C  50 50   70 80   60 105
               C  50 118  25 120  10 110"/>
      <!-- 左脚（脚掌，五趾展开） -->
      <path d="M -70 110
               C -85 115  -95 118  -100 124
               M -100 124 l -8 6 m 0 -2 l -6 2
               M -100 124 l -2 10
               M -100 124 l  6 10 m 0 -2 l  4 4"/>
      <!-- 右脚 -->
      <path d="M  60 105
               C  78 108  92 112  100 120
               M 100 120 l 10 4 m 0 -2 l 6 2
               M 100 120 l 6 10
               M 100 120 l -2 12"/>
    </g>

    <!-- 身躯（蹲坐的圆肚）-->
    <path d="M -55 -10
             C -75  20  -65  60  -30  60
             C   0   62   40  55   50  30
             C  58   5   40 -20    0 -22
             C -30 -22  -50 -20  -55 -10 Z"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 胸腹毛纹 -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -30 30 q12 -6 24 4"/>
      <path d="M -30 44 q12 -6 24 4"/>
      <path d="M -28 16 q10 -4 20 2"/>
    </g>

    <!-- 左前肢（搭膝，弯曲）-->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M -38 0
               C -55 18  -60 38  -50 56
               C -45 64  -35 64  -28 56"/>
      <!-- 左手（长指，握着） -->
      <path d="M -50 56
               C -55 62  -58 66  -54 70
               M -54 70 l -6 4
               M -54 70 l -2 8
               M -54 70 l  4 8
               M -54 70 l  8 4"/>
    </g>

    <!-- 右前肢（抬起挠颊，灵动）-->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M 35 -8
               C 55 4  62 18  56 32
               C 50 42  38 44  28 38"/>
      <!-- 右手（爪形，触颊） -->
      <path d="M 56 32
               C 62 36  64 40  60 44
               M 60 44 l 6 2
               M 60 44 l 4 6
               M 60 44 l 0 8
               M 60 44 l -4 6"/>
    </g>

    <!-- 头部（向左上微侧） -->
    <g transform="translate(0 -50)">
      <!-- 头型（圆脸） -->
      <path d="M -38 -8
               C -45 -30  -22 -42   2 -40
               C  26 -42   42 -28   40 -8
               C  38  12   18  20  -2  18
               C -22  18  -36   8  -38 -8 Z"
            stroke-width="3.2" fill="#fbf2d6"/>

      <!-- 头顶小耳（左） -->
      <path d="M -32 -34 q -10 -8 -6 -16 q 6 -2 10 8 Z"
            stroke-width="2.2" fill="#fbf2d6"/>
      <!-- 耳内红晕 -->
      <path d="M -30 -32 q -4 -4 -2 -8" stroke-width="1.2"/>
      <!-- 头顶小耳（右） -->
      <path d="M  28 -36 q  10 -8  6 -16 q -6 -2 -10 8 Z"
            stroke-width="2.2" fill="#fbf2d6"/>
      <path d="M 26 -34 q  4 -4  2 -8" stroke-width="1.2"/>

      <!-- 眼窝（皱眉骨） -->
      <path d="M -22 -10 q12 -6 24 -2" stroke-width="2"/>
      <!-- 圆眼 -->
      <circle cx="-12" cy="-6" r="4.2" fill="#1d1308"/>
      <circle cx="-10" cy="-8" r="1.2" fill="#fbf2d6"/>
      <circle cx=" 12" cy="-6" r="4.2" fill="#1d1308"/>
      <circle cx=" 14" cy="-8" r="1.2" fill="#fbf2d6"/>

      <!-- 鼻 -->
      <path d="M -2 4 q 2 4 4 0" stroke-width="1.6"/>
      <!-- 鼻孔两点 -->
      <circle cx="-1" cy="6" r="0.9" fill="#1d1308"/>
      <circle cx=" 3" cy="6" r="0.9" fill="#1d1308"/>

      <!-- 嘴（略抿） -->
      <path d="M -8 12 q 8 4 16 0" stroke-width="2"/>

      <!-- 颊毛（几缕细毛表示毛茸茸） -->
      <g stroke-width="1.2" opacity="0.8">
        <path d="M -38 -2 q -8 6 -4 14"/>
        <path d="M  38 -2 q  8 6  4 14"/>
      </g>

      <!-- 额顶毛尖（一点呆毛） -->
      <path d="M -2 -38 q 0 -10 4 -14" stroke-width="1.6"/>
    </g>

    <!-- 一颗仙桃（右下角，手旁点缀） -->
    <g transform="translate(90 80)" stroke-width="2.2" fill="#fbf2d6">
      <path d="M -12 0 q 0 -16 12 -16 q 12 0 12 16 q 0 14 -12 14 q -12 0 -12 -14 Z"/>
      <!-- 桃尖 -->
      <path d="M -2 -16 q 4 -4 8 -2" stroke-width="1.6"/>
      <!-- 叶柄小叶 -->
      <path d="M 4 -20 q 8 -4 12 -2 q -4 6 -12 4 Z" fill="#fbf2d6"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">觜火猴</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属火　|　神兽为猴</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">西　方　白　虎　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，觜宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">觜</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
