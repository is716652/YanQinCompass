<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 亢金龙
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：金龙（祥云中盘踞的长龙）居中于 (300, 280)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 背景云气（淡） -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35" fill="none">
      <path d="M-150 -90 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M-150 110 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <!-- 龙身躯主体：S 形盘旋（外轮廓双线，暗含鳞甲片） -->
    <path d="M -130  30
             C -120 -10  -80 -50  -30 -55
             C  20 -60   60 -30   70  10
             C  78  40   60  70   20  80
             C -20  90  -60  70  -80  40
             C -100  10 -110  60  -90  90
             C -70  120 -30  130   10 110
             C  60  90  100  60  120  20"
          stroke-width="4.2" fill="#fbf2d6"/>

    <!-- 龙脊鳍（沿背脊分布的尖刺） -->
    <g stroke-width="2" fill="#1d1308">
      <path d="M -100  -10 l 4 -14 l 6 14 Z"/>
      <path d="M -60   -32 l 4 -14 l 6 14 Z"/>
      <path d="M -20   -50 l 4 -14 l 6 14 Z"/>
      <path d="M  20   -42 l 4 -14 l 6 14 Z"/>
      <path d="M  55   -18 l 4 -14 l 6 14 Z"/>
      <path d="M  65    22 l 4 -14 l 6 14 Z"/>
      <path d="M  50    55 l 4 -14 l 6 14 Z"/>
    </g>

    <!-- 身躯内侧鳞纹（弧线暗示鳞甲） -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -90 -10 q18 12 38 4"/>
      <path d="M -50 -35 q20 12 42 4"/>
      <path d="M -10 -45 q20 12 42 4"/>
      <path d="M  30 -28 q18 14 38 6"/>
      <path d="M  55   0 q12 16 28 6"/>
      <path d="M  55  36 q-2 18 -22 6"/>
      <path d="M  20  70 q-18 14 -42 6"/>
      <path d="M -40  80 q-22 12 -50 4"/>
      <path d="M -85  50 q-18 14 -36 4"/>
    </g>

    <!-- 头部（右上，朝左下）-->
    <g transform="translate(105 5)">
      <!-- 鹿角分叉（双侧） -->
      <g stroke-width="2">
        <path d="M -10 -22 q-2 -10 -10 -16 m 6 6 q-6 0 -10 4"/>
        <path d="M  10 -24 q 2 -12 10 -18 m -8 8 q 8 -2 12 4"/>
        <path d="M  -2 -28 q 0 -16 -4 -24"/>
        <path d="M   2 -30 q 2 -18 6 -26"/>
      </g>
      <!-- 头型外轮廓 -->
      <path d="M -38 -4
               C -46 -22  -22 -34   2 -32
               C  22 -34  40 -22   44  -2
               C  46  12   34  22   14  22
               C  -8  24 -28  16  -38  -4 Z"
            stroke-width="3" fill="#fbf2d6"/>
      <!-- 鬃毛（脑后飘扬） -->
      <g stroke-width="1.6" opacity="0.9">
        <path d="M -22 -22 q -10 -10 -22 -8"/>
        <path d="M -30 -16 q -14 -6 -28 -2"/>
        <path d="M -34  -8 q -16 -2 -30 4"/>
        <path d="M -34   0 q -16  2 -30 10"/>
        <path d="M -28   8 q -14  6 -28 14"/>
      </g>
      <!-- 眉骨/眼窝 -->
      <path d="M -8 -18 q12 -6 24 2" stroke-width="2"/>
      <!-- 圆睛 -->
      <circle cx="0"  cy="-14" r="4.5" fill="#1d1308"/>
      <circle cx="2"  cy="-16" r="1.4" fill="#fbf2d6"/>
      <!-- 鼻孔 -->
      <path d="M 30  0 q4 2 6 6" stroke-width="2"/>
      <!-- 嘴裂 -->
      <path d="M -34 4 Q 0 22 36 8" stroke-width="2.2" fill="#7a1f15" fill-opacity="0.15"/>
      <!-- 利齿 -->
      <path d="M -10 14 l 3 6 l 3 -6 M 0 16 l 3 6 l 3 -6 M 12 16 l 3 5 l 3 -5 M 24 14 l 3 4 l 3 -4"
            stroke-width="1.4" fill="#fbf2d6"/>
      <!-- 龙须两条 -->
      <path d="M 38 6 q26 14 44 28 q12 12 12 30" stroke-width="1.8"/>
      <path d="M 32 14 q28 4 52 14 q14 6 18 22" stroke-width="1.8"/>
    </g>

    <!-- 前肢（左下，三爪）-->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M -60 -10
               C -64 12  -58 32  -68 50
               M -68 50 l -10 14 m 0 -2 l -6 4
               M -68 50 l   0 16
               M -68 50 l  10 14 m 0 -2 l  6 4"/>
      <circle cx="-60" cy="-10" r="2.6" fill="#1d1308"/>
    </g>

    <!-- 后肢（右下，三爪）-->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M  50  40
               C  52 60   46 80   54 96
               M 54 96 l -10 12 m 0 -2 l -6 4
               M 54 96 l   0 14
               M 54 96 l  10 12 m 0 -2 l  6 4"/>
      <circle cx="50" cy="40" r="2.6" fill="#1d1308"/>
    </g>

    <!-- 尾梢上扬翻卷 -->
    <path d="M 120 20 q 30 -10 50 4 q 12 10 6 28 q -6 14 -22 14"
          stroke-width="3" fill="#fbf2d6"/>
    <!-- 尾鳞点 -->
    <g stroke-width="1.2" fill="#1d1308">
      <circle cx="135" cy="14" r="1.6"/>
      <circle cx="156" cy="20" r="1.6"/>
      <circle cx="170" cy="34" r="1.6"/>
      <circle cx="168" cy="52" r="1.6"/>
    </g>

    <!-- 周围小祥云 -->
    <g stroke-width="1.4" opacity="0.7">
      <path d="M -150 60 q 10 -10 22 -4 q 4 -10 18 -6 q 14 -2 14 10 q 0 6 -8 6 q -8 4 -16 -2 q -10 6 -22 2 q -12 -2 -8 -6 Z"
            fill="#fbf2d6"/>
      <path d="M 110 -110 q 10 -10 22 -4 q 4 -10 18 -6 q 14 -2 14 10 q 0 6 -8 6 q -8 4 -16 -2 q -10 6 -22 2 q -12 -2 -8 -6 Z"
            fill="#fbf2d6"/>
    </g>
  </g>

  <!-- ⑥ 题款区 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">亢金龙</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属金　|　神兽为龙</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">东　方　青　龙　七　宿</text>

  <!-- ⑦ 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">亢</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
