<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 张月鹿（南方朱雀第五宿，仙鹿立姿）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：瑞鹿昂首立姿，分枝大角
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影 -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -120 120 q60 -10 240 0"/>
    </g>

    <!-- 后腿（右后） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M 50 32
               C 64 60  66 100  60 118
               C 58 126 48 126 44 120"/>
      <!-- 偶蹄 -->
      <path d="M 44 120
               C 44 130 42 134 38 134
               M 38 134 l -6 4 m 0 -2 l -4 2
               M 44 120
               C 50 126 52 134 50 134
               M 50 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 前腿（左前，挺立） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M -36 32
               C -38 60  -36 100  -32 118
               C -32 126  -22 126  -18 120"/>
      <path d="M -18 120
               C -18 130 -20 134 -24 134
               M -24 134 l -6 4 m 0 -2 l -4 2
               M -18 120
               C -12 126 -10 134 -12 134
               M -12 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 前腿（右前） -->
    <g stroke-width="3.2" fill="#fbf2d6">
      <path d="M 16 32
               C 18 60  20 100  18 118
               C 18 126  28 126  32 120"/>
      <path d="M 32 120
               C 32 130 30 134 26 134
               M 26 134 l -6 4 m 0 -2 l -4 2
               M 32 120
               C 38 126 40 134 38 134
               M 38 134 l 6 4 m 0 -2 l 4 2"/>
    </g>

    <!-- 身躯（修长优雅） -->
    <path d="M -64 -10
             C -82 12  -82  44  -56  50
             C -22  58   30  56   56  46
             C  80  36   84  -4   68 -22
             C  54 -38   28 -42    0 -42
             C -28 -42  -56 -34  -64 -10 Z"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 梅花斑点（鹿皮） -->
    <g fill="#1d1308" stroke="none" opacity="0.85">
      <circle cx="-30" cy="0"   r="2.4"/>
      <circle cx="-14" cy="14"  r="2"/>
      <circle cx="  4" cy="0"   r="2.4"/>
      <circle cx=" 22" cy="14"  r="2"/>
      <circle cx=" 40" cy="2"   r="2"/>
      <circle cx="-22" cy="28"  r="2"/>
      <circle cx=" 12" cy="32"  r="2"/>
      <circle cx=" 36" cy="24"  r="1.6"/>
    </g>

    <!-- 短尾（鹿尾短小） -->
    <path d="M -68 6 q -14 -4 -20 -14 q 6 -4 14 0"
          stroke-width="2.4" fill="#fbf2d6"/>
    <!-- 尾下绒 -->
    <path d="M -80 -8 q -6 6 -2 12" stroke-width="1.4" opacity="0.85"/>

    <!-- 头部（侧面，头微抬） -->
    <g transform="translate(-40 -42)">
      <!-- 修长鹿脸 -->
      <path d="M  18  -16
               C  10 -34  -14 -38  -30 -30
               C -44 -20  -46  -4  -42   8
               C -36  18  -22  22  -10  18
               C   4  14   18   6   22  -4
               C  24 -10   22 -16   18 -16 Z"
            stroke-width="3.2" fill="#fbf2d6"/>

      <!-- 大耳（修长，柳叶形）—— 左 -->
      <path d="M -16 -32
               C -28 -52  -42 -50  -44 -38
               C -42 -28  -30 -26  -20 -28 Z"
            stroke-width="2.4" fill="#fbf2d6"/>
      <path d="M -22 -38 q -8 -6 -14 0" stroke-width="1.2"/>
      <!-- 大耳 —— 右 -->
      <path d="M  18 -34
               C  30 -54   44 -52   46 -40
               C  44 -30   32 -28   22 -30 Z"
            stroke-width="2.4" fill="#fbf2d6"/>
      <path d="M  24 -40 q  8 -6 14 0" stroke-width="1.2"/>

      <!-- 大分枝鹿角（左）—— 主特征 -->
      <g stroke-width="2.8" fill="#fbf2d6">
        <!-- 主干 -->
        <path d="M -14 -36
                 C -16 -54  -22 -68  -18 -84"/>
        <!-- 第一分枝（向前） -->
        <path d="M -18 -60 q 10 -4 14 -14"/>
        <path d="M -10 -64 q 8 -2 12 -10"/>
        <!-- 第二分枝（向后） -->
        <path d="M -20 -70 q -14 -4 -20 -16"/>
        <path d="M -20 -78 q -10 -2 -16 -10"/>
        <!-- 角尖 -->
        <path d="M -18 -84 q 0 -8 4 -12"/>
      </g>

      <!-- 大分枝鹿角（右） -->
      <g stroke-width="2.8" fill="#fbf2d6">
        <path d="M  10 -34
                 C  14 -52   22 -68   20 -86"/>
        <path d="M 14 -58 q -10 -4 -14 -14"/>
        <path d="M  6 -62 q -8 -2 -12 -10"/>
        <path d="M 18 -68 q 14 -4 20 -16"/>
        <path d="M 20 -78 q 10 -2 16 -10"/>
        <path d="M 20 -86 q 0 -8 -4 -12"/>
      </g>

      <!-- 大眼（温润） -->
      <ellipse cx="-12" cy="-12" rx="3.6" ry="3" fill="#1d1308"/>
      <circle cx="-10" cy="-14" r="1.2" fill="#fbf2d6"/>

      <!-- 鼻（黑） -->
      <path d="M -36 0 q 4 -2 6 4" stroke-width="1.6"/>
      <circle cx="-34" cy="2" r="1.1" fill="#1d1308"/>

      <!-- 嘴（抿） -->
      <path d="M -40 8 q 6 4 12 0" stroke-width="1.8"/>

      <!-- 眉骨细弧 -->
      <path d="M -22 -16 q 10 -4 18 -2" stroke-width="1.4" opacity="0.7"/>
    </g>

    <!-- 颈下斑 -->
    <g fill="#1d1308" stroke="none" opacity="0.85">
      <circle cx="-22" cy="-20" r="1.8"/>
      <circle cx="-10" cy="-14" r="1.6"/>
    </g>

    <!-- 一丛灵芝草点缀 -->
    <g transform="translate(110 100)" stroke-width="2">
      <path d="M -6 18 q 0 -16 6 -22 q 6 6 6 22 Z" fill="#fbf2d6"/>
      <path d="M -10 -4 q 4 -6 10 -6 q 6 0 10 6 q -4 -2 -10 -2 q -6 0 -10 2 Z"
            fill="#fbf2d6"/>
      <path d="M -4 -10 q 4 -8 10 -8" />
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">张月鹿</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属月　|　神兽为鹿</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，张宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">张</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
