<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 氐土狢
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：狢（貉，浣熊面短腿粗胖）居中于 (300, 280)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 尾巴（环形粗尾，末梢在右上方，绕一圈） -->
    <g stroke-width="3.6" fill="#fbf2d6">
      <path d="M 50 40
               C 100 30  140 60  140 100
               C 140 140 100 150  70 130
               C 40 110   50  70   80  70
               C 100 70  100 100   80 110"/>
    </g>
    <!-- 尾巴环纹（深色环带） -->
    <g stroke-width="2.4" fill="none" opacity="0.95">
      <path d="M 80 46 q 18 -2 30 6"/>
      <path d="M 118 60 q 14 8 18 22"/>
      <path d="M 138 100 q -6 18 -22 24"/>
      <path d="M 96 138 q -22 -2 -32 -16"/>
      <path d="M 60 110 q -4 -18 12 -28"/>
    </g>

    <!-- 后腿（短壮，坐在画面下方）-->
    <g stroke-width="3" fill="#fbf2d6">
      <!-- 左后腿 -->
      <path d="M -40 70 C -50 95 -50 115 -56 130"/>
      <!-- 左后爪 -->
      <path d="M -56 130 l -10 8 m 0 -2 l -6 0 M -56 130 l 0 12 m -2 -2 l 2 2 M -56 130 l 10 8 m 0 -2 l 6 0"/>
      <!-- 右后腿 -->
      <path d="M 30 80 C 40 100 42 120 50 132"/>
      <!-- 右后爪 -->
      <path d="M 50 132 l -10 8 m 0 -2 l -6 0 M 50 132 l 0 12 m -2 -2 l 2 2 M 50 132 l 10 8 m 0 -2 l 6 0"/>
    </g>

    <!-- 身躯（圆胖坐姿）-->
    <path d="M -80 20
             C -90 -20 -50 -50   0 -50
             C  50 -50  80 -20   80  20
             C  80  60  60  90   20 100
             C -20 110 -60  90  -80  60
             C -90  40 -85  30  -80  20 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 腹部弧线（暗示圆胖） -->
    <path d="M -50 60 q 30 30 80 0" stroke-width="1.6" opacity="0.6"/>

    <!-- 前腿（短粗，坐在胸前）-->
    <g stroke-width="3" fill="#fbf2d6">
      <!-- 左前腿 -->
      <path d="M -50 30 C -56 50 -52 70 -58 88"/>
      <!-- 左前爪 -->
      <path d="M -58 88 l -10 8 m 0 -2 l -6 0 M -58 88 l 0 12 m -2 -2 l 2 2 M -58 88 l 10 8 m 0 -2 l 6 0"/>
      <!-- 右前腿 -->
      <path d="M 30 36 C 36 56 32 76 38 92"/>
      <!-- 右前爪 -->
      <path d="M 38 92 l -10 8 m 0 -2 l -6 0 M 38 92 l 0 12 m -2 -2 l 2 2 M 38 92 l 10 8 m 0 -2 l 6 0"/>
    </g>

    <!-- 头部（朝左前方）-->
    <g transform="translate(-30 -65)">
      <!-- 头型（圆）-->
      <path d="M -50 0
               C -60 -22 -30 -38  0 -38
               C  30 -38  56 -22   54   0
               C  56  18   40  28   16  30
               C -10  32 -30  24  -50  0 Z"
            stroke-width="3.4" fill="#fbf2d6"/>

      <!-- 圆耳（两枚）-->
      <path d="M -28 -34 q -8 -10 -2 -18 q 6 -6 10 4 z" stroke-width="2.6" fill="#fbf2d6"/>
      <path d="M  22 -34 q  8 -10  2 -18 q -6 -6 -10 4 z" stroke-width="2.6" fill="#fbf2d6"/>
      <!-- 耳内粉 -->
      <path d="M -26 -36 q -4 -6 0 -12 q 4 -2 6 4 z" stroke-width="1.4" fill="#a8362a" opacity="0.55"/>
      <path d="M  24 -36 q  4 -6 0 -12 q -4 -2 -6 4 z" stroke-width="1.4" fill="#a8362a" opacity="0.55"/>

      <!-- 浣熊面黑色眼罩（标志性宽带横过眼周）-->
      <path d="M -50 -6
               C -46 -16 -28 -22 -8 -20
               C  10 -22  30 -16  40  -6
               C  30  6   12  8   -4  6
               C -22  8 -42  4  -50 -6 Z"
            stroke-width="0" fill="#1d1308" opacity="0.95"/>

      <!-- 眼（白仁/亮点，居于黑色面罩内）-->
      <circle cx="-20" cy="-8" r="3.4" fill="#fbf2d6"/>
      <circle cx="-20" cy="-8" r="1.6" fill="#1d1308"/>
      <circle cx="18"  cy="-8" r="3.4" fill="#fbf2d6"/>
      <circle cx="18"  cy="-8" r="1.6" fill="#1d1308"/>

      <!-- 鼻头（小黑三角）-->
      <path d="M -6 14 l 8 0 l -4 6 z" stroke-width="1.4" fill="#1d1308"/>

      <!-- 嘴线 -->
      <path d="M -8 22 q 4 4 8 0" stroke-width="1.6"/>
      <path d="M  4 22 q 4 4 8 0" stroke-width="1.6"/>

      <!-- 颊须 -->
      <g stroke-width="1" opacity="0.7">
        <path d="M -28 12 q -10 2 -16 8"/>
        <path d="M -28 18 q -10 4 -16 12"/>
        <path d="M  34 12 q 10 2 16 8"/>
        <path d="M  34 18 q 10 4 16 12"/>
      </g>

      <!-- 头顶额头白纹（猫科有的"白额"，貉也有小亮点）-->
      <path d="M -2 -36 q 4 -8 8 0" stroke-width="1.4" opacity="0.7"/>
    </g>

    <!-- 身上零星绒毛（短笔触） -->
    <g stroke-width="1" opacity="0.5">
      <path d="M -60 30 q 4 -4 8 0"/>
      <path d="M -40 50 q 4 -4 8 0"/>
      <path d="M -20 60 q 4 -4 8 0"/>
      <path d="M  10 60 q 4 -4 8 0"/>
      <path d="M  40 50 q 4 -4 8 0"/>
      <path d="M  60 30 q 4 -4 8 0"/>
    </g>
  </g>

  <!-- ⑥ 题款区 -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">氐土狢</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属土　|　神兽为狢</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">东　方　青　龙　七　宿</text>

  <!-- ⑦ 钤印 -->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">氐</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
