<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 星日马（南方朱雀第四宿，骏马昂首）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：骏马昂首，鬃毛飞扬，长尾飘动
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影 -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -150 120 q60 -10 280 0"/>
    </g>

    <!-- 长尾（向后下方飘扬）-->
    <g stroke-width="3" fill="#fbf2d6">
      <path d="M -78 22
               C -110 38  -130 70  -120 110
               C -116 130  -100 138  -88 130
               C  -80 124  -78 112  -82 100
               C  -90  76 -100  56  -88  40"/>
      <!-- 尾梢分支（似马尾散开） -->
      <path d="M -120 110 q -10 14 -16 12 q 4 -10 10 -16" stroke-width="2"/>
      <path d="M -116 116 q  -8 14 -2 18  q 4 -8 8 -16" stroke-width="2"/>
      <path d="M -110 124 q  -4 14  4 16  q 4 -6 6 -14" stroke-width="2"/>
    </g>

    <!-- 后腿（右后，微微后踏） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M 60 30
               C 80 60  86 100  76 118
               C 72 126 60 126 56 120"/>
      <!-- 单蹄（马蹄圆） -->
      <path d="M 56 120
               C 56 130 64 134 70 132
               C 74 130 74 124 70 120 Z"
            stroke-width="2.4" fill="#1d1308"/>
    </g>

    <!-- 后腿（左后，略弯） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M 30 32
               C 32 64  30 100  24 118
               C 22 126 12 126  8 120"/>
      <path d="M 8 120
               C 8 130 16 134 22 132
               C 26 130 26 124 22 120 Z"
            stroke-width="2.4" fill="#1d1308"/>
    </g>

    <!-- 身躯（修长饱满） -->
    <path d="M -70 -10
             C -88 10  -86  44  -60  52
             C -20  62   40  60   76  44
             C  92  32   96   0   80 -22
             C  66 -38   40 -44    8 -44
             C -28 -44  -60 -34  -70 -10 Z"
          stroke-width="4" fill="#fbf2d6"/>

    <!-- 肌肉线条 -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -30 16 q 24 -8  50 -2"/>
      <path d="M -28 36 q 24 -8  48 -2"/>
    </g>

    <!-- 前腿（右前，挺直） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M 36 30
               C 36 60  40 100  38 120
               C 38 130  46 132  50 126"/>
      <path d="M 50 126
               C 50 136 58 138 62 134
               C 64 130 62 124 58 122 Z"
            stroke-width="2.4" fill="#1d1308"/>
    </g>

    <!-- 前腿（左前，略抬） -->
    <g stroke-width="3.4" fill="#fbf2d6">
      <path d="M -10 30
               C -16 56  -20 80  -8 100
               C  -2 110   8 110   12 100"/>
      <path d="M 12 100
               C 12 110 20 112 24 108
               C 26 104 24 98 20 96 Z"
            stroke-width="2.4" fill="#1d1308"/>
    </g>

    <!-- 鬃毛（自颈后向后飘扬，多缕） -->
    <g stroke-width="1.8" opacity="0.95">
      <path d="M -8 -42 q -16 -10 -22 -30"/>
      <path d="M -2 -44 q -10 -16 -10 -36"/>
      <path d="M  6 -44 q  -2 -18   2 -38"/>
      <path d="M 14 -42 q   8 -18  14 -34"/>
      <path d="M 22 -40 q  16 -16  24 -28"/>
      <path d="M 30 -36 q  22 -10  32 -18"/>
      <!-- 鬃毛内层 -->
      <path d="M -4 -34 q -8 -10 -10 -22" stroke-width="1" opacity="0.6"/>
      <path d="M  6 -36 q  0 -12   4 -22" stroke-width="1" opacity="0.6"/>
      <path d="M 16 -34 q  8 -10  14 -20" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 头部（朝左昂起） -->
    <g transform="translate(-58 -64)">
      <!-- 长马脸 -->
      <path d="M  22  -8
               C  16 -28   -8 -34  -28 -28
               C -42 -22  -46  -8  -44   4
               C -42  16  -30  22  -16  18
               C   0  14   14   6   22  -2
               C  26  -6   26  -8   22  -8 Z"
            stroke-width="3.4" fill="#fbf2d6"/>

      <!-- 鬃毛沿颈延伸至头顶 -->
      <g stroke-width="1.6" opacity="0.95">
        <path d="M  4 -26 q  -4 -16  -2 -28"/>
        <path d="M 10 -28 q   2 -18   6 -28"/>
        <path d="M 18 -28 q   8 -16  14 -22"/>
      </g>

      <!-- 耳（尖，朝上） -->
      <path d="M -10 -32 q -4 -16 4 -20 q 4 6 2 18 Z"
            stroke-width="2.2" fill="#fbf2d6"/>
      <path d="M -8 -34 q -2 -8 2 -12" stroke-width="1"/>
      <!-- 右耳 -->
      <path d="M  6 -30 q  0 -16 8 -18 q 2 6 0 16 Z"
            stroke-width="2.2" fill="#fbf2d6"/>
      <path d="M  8 -32 q  0 -8 4 -10" stroke-width="1"/>

      <!-- 大眼 -->
      <ellipse cx="-22" cy="-12" rx="4" ry="3" fill="#1d1308"/>
      <circle cx="-20" cy="-13" r="1.1" fill="#fbf2d6"/>

      <!-- 鼻梁弧线 -->
      <path d="M -2 -22 q -16 6 -32 12" stroke-width="1.4" opacity="0.7"/>

      <!-- 鼻孔 -->
      <ellipse cx="-40" cy="-2" rx="2" ry="1.4" fill="#1d1308"/>

      <!-- 嘴 -->
      <path d="M -42 8 q 6 4 12 0" stroke-width="2"/>
      <!-- 唇下弧 -->
      <path d="M -42 6 q -2 6 4 8" stroke-width="1.4" opacity="0.7"/>

      <!-- 额顶一点白斑（瑞相） -->
      <path d="M -2 -22 q 4 -4 6 0 q -2 4 -6 0 Z" stroke-width="1.2" fill="#fbf2d6"/>
    </g>

    <!-- 一缕飞鬃点缀（颈侧飘带） -->
    <g stroke-width="1.4" opacity="0.85">
      <path d="M -20 -38 q -6 8 -2 18"/>
      <path d="M -12 -36 q 0 8 6 16"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">星日马</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属日　|　神兽为马</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，星宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">星</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
