<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 翼火蛇（南方朱雀第六宿，昂首吐信）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：盘蛇昂首，吐信，鳞纹密布
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 地面阴影（淡） -->
    <g stroke="#3a2618" stroke-width="1" opacity="0.35">
      <path d="M -100 130 q60 -10 200 0"/>
    </g>

    <!-- 盘蛇身躯（多层叠加，从外圈到内圈再到昂起的颈）-->
    <!-- 最外圈（大盘） -->
    <path d="M -130  60
             C -160  20  -140 -40  -80 -70
             C  -20 -100  60 -100  110 -70
             C  150 -40  150  20  120  60
             C  100  90   60  100   20  100"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 中间圈（蛇身穿过） -->
    <path d="M  20  100
             C  -20 110  -60  90  -80  50
             C -100  10  -90 -30  -50 -50
             C  -10 -68   40 -68   70 -50"
          stroke-width="3.4" fill="#fbf2d6"/>

    <!-- 内圈盘绕 -->
    <path d="M  70 -50
             C  96 -30  100   0   80  20
             C  60  40   30  44    0  36
             C -20  30  -30  20  -28   0
             C -26 -10  -20 -16  -10 -16"
          stroke-width="3.2" fill="#fbf2d6"/>

    <!-- 昂起的颈（从内圈向上伸展） -->
    <path d="M -10 -16
             C   2 -40   8 -68  -4 -90
             C -16 -110 -34 -114 -42 -100
             C -50  -86  -44  -68  -32  -60"
          stroke-width="3.4" fill="#fbf2d6"/>

    <!-- 颈的另一侧轮廓（闭合） -->
    <path d="M -32 -60
             C -22 -78  -8 -86   4 -78
             C  12 -68  10 -52   2 -42"
          stroke-width="3" fill="#fbf2d6"/>

    <!-- 蛇头（顶端，张开嘴） -->
    <g transform="translate(-12 -94)">
      <!-- 头型（菱形/三角） -->
      <path d="M -22 -4
               C -22 -18  -10 -22    0 -22
               C  12 -22   22 -16   22 -4
               C  22   8   12  14    0  12
               C -12  14  -22   6  -22 -4 Z"
            stroke-width="3.2" fill="#fbf2d6"/>

      <!-- 鼻（尖） -->
      <path d="M -2 -22 q  2 4  4 0" stroke-width="1.4"/>
      <!-- 鼻孔 -->
      <circle cx="-3" cy="-20" r="0.8" fill="#1d1308"/>
      <circle cx=" 3" cy="-20" r="0.8" fill="#1d1308"/>

      <!-- 圆眼（蛇眼，金黄配黑瞳） -->
      <circle cx="-12" cy="-12" r="3.6" fill="#1d1308"/>
      <ellipse cx="-12" cy="-12" rx="1.6" ry="3" fill="#fbf2d6"/>
      <circle cx="-12" cy="-12" r="0.9" fill="#1d1308"/>
      <circle cx=" 12" cy="-12" r="3.6" fill="#1d1308"/>
      <ellipse cx=" 12" cy="-12" rx="1.6" ry="3" fill="#fbf2d6"/>
      <circle cx=" 12" cy="-12" r="0.9" fill="#1d1308"/>

      <!-- 嘴裂（张开，红信） -->
      <path d="M -22 0 Q 0 14 22 0" stroke-width="2.2" fill="#7a1f15" fill-opacity="0.18"/>
      <!-- 上下唇 -->
      <path d="M -22 -2 q 4 -2 8 0" stroke-width="1.4"/>
      <path d="M  22 -2 q -4 -2 -8 0" stroke-width="1.4"/>
      <path d="M -22  2 q 4  2 8 0" stroke-width="1.4"/>
      <path d="M  22  2 q -4  2 -8 0" stroke-width="1.4"/>

      <!-- 蛇信（叉状，关键特征） -->
      <path d="M  0 6 l -4 12 m 4 -12 l  4 12 M -4 18 l -2 8 m 6 -8 l 2 8"
            stroke-width="1.8" stroke="#a8362a"/>

      <!-- 颊鳞（头部花纹） -->
      <g stroke-width="1.2" opacity="0.85">
        <path d="M -18 -16 q -4 6 -2 12"/>
        <path d="M  18 -16 q  4 6  2 12"/>
        <path d="M -6  -22 q  0 6  2 10"/>
        <path d="M  6  -22 q  0 6 -2 10"/>
      </g>
    </g>

    <!-- 鳞片（沿蛇身密集铺陈） -->
    <g stroke-width="1.2" opacity="0.9">
      <!-- 外圈鳞 -->
      <path d="M -100 60 q 8 -4 16 0"/>
      <path d="M -84 76 q 8 -4 16 0"/>
      <path d="M -68 88 q 8 -4 16 0"/>
      <path d="M -130 30 q 8 -2 14 -2"/>
      <path d="M -130  0 q 8 -2 14 -4"/>
      <path d="M -120 -30 q 8 -2 14 -6"/>
      <path d="M -100 -54 q 6 -4 14 -6"/>
      <path d="M -70 -68 q 6 -4 14 -4"/>
      <path d="M -34 -76 q 6 -2 12 0"/>
      <path d="M  -2 -76 q 6 -2 12 0"/>
      <path d="M  28 -68 q 6 -2 12 0"/>
      <path d="M  60 -54 q 6 -2 12 2"/>
      <path d="M  86 -28 q 4 -4 12 0"/>
      <path d="M 100  -2 q 4 -4 12 2"/>
      <path d="M 102  22 q 4 -4 12 4"/>
      <path d="M  90  44 q 4 -4 12 4"/>
      <path d="M  66  60 q 4 -4 12 4"/>

      <!-- 中圈鳞 -->
      <path d="M  20  96 q 6 -4 14 0"/>
      <path d="M  -2  94 q 6 -4 14 0"/>
      <path d="M -28  90 q 6 -4 14 0"/>
      <path d="M -52  80 q 6 -4 14 0"/>
      <path d="M -70  56 q 6 -4 14 0"/>
      <path d="M -78  30 q 6 -2 12 -2"/>
      <path d="M -82   4 q 6 -2 12 -4"/>
      <path d="M -78 -22 q 6 -2 12 -6"/>
      <path d="M -64 -42 q 6 -2 12 -6"/>
      <path d="M -42 -56 q 6 -2 12 -2"/>
      <path d="M -16 -60 q 6 -2 12 -2"/>
      <path d="M  12 -60 q 6 -2 12 0"/>
      <path d="M  40 -54 q 6 -2 12 0"/>
      <path d="M  60 -38 q 4 -4 10 -2"/>

      <!-- 内圈鳞 -->
      <path d="M  60 -36 q 6 -2 10 4"/>
      <path d="M  68 -16 q 6 -2 10 6"/>
      <path d="M  68   6 q 6 -2 10 8"/>
      <path d="M  56  24 q 6 -2  8 8"/>
      <path d="M  36  36 q 4 -2  6 8"/>
      <path d="M  10  38 q 4 -2  4 8"/>
      <path d="M -16  30 q 0 -2 -2 8"/>

      <!-- 颈鳞 -->
      <path d="M -38 -64 q 4 -2  8 2"/>
      <path d="M -36 -76 q 4 -2  8 4"/>
      <path d="M -28 -88 q 4 -2  8 4"/>
      <path d="M -16 -94 q 4 -2  8 4"/>
    </g>

    <!-- 一片落叶（点缀） -->
    <g transform="translate(110 110)" stroke-width="1.6" fill="#fbf2d6">
      <path d="M -14 0 q 0 -10 14 -10 q 14 0 14 10 q 0 10 -14 10 q -14 0 -14 -10 Z"/>
      <path d="M 0 -8 q 0 16 0 16" stroke-width="1"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">翼火蛇</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属火　|　神兽为蛇</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，翼宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">翼</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
