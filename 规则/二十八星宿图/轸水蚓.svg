<?xml version="1.0" encoding="UTF-8"?>
<!-- 二十八星宿图鉴 · 轸水蚓（南方朱雀第七宿，蚯蚓盘曲）
     画布 600x600；所有坐标相对于 viewBox。
     风格：朱砂边框 + 米黄卷轴 + 圆形牌饰 + 工笔淡墨 + 楷书题款。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'STKaiti','KaiTi','楷体','Songti SC','SimSun',serif">
  <defs>
    <!-- 卷轴纸底：内圈米黄径向 -->
    <radialGradient id="medallion" cx="50%" cy="48%" r="58%">
      <stop offset="0%"  stop-color="#fbf2d6"/>
      <stop offset="70%" stop-color="#f1e2b6"/>
      <stop offset="100%" stop-color="#d9c489"/>
    </radialGradient>
    <!-- 朱砂印泥渐变 -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#7a1f15"/>
      <stop offset="100%" stop-color="#a8362a"/>
    </linearGradient>
    <!-- 祥云渐变 -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d8b25a"/>
      <stop offset="100%" stop-color="#a17a30"/>
    </linearGradient>
    <!-- 卷纸张纹理（极淡噪点） -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
    </filter>
    <!-- 角落云纹 -->
    <symbol id="cornerCloud" viewBox="0 0 60 60">
      <path d="M2 30 Q10 18 22 22 Q26 8 40 14 Q52 8 56 22 L56 36 Q48 30 40 36 Q30 28 22 36 Q12 32 2 38 Z"
            fill="url(#cloud)" stroke="#7a5a22" stroke-width="0.8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ① 外层宣纸底 -->
  <rect width="600" height="600" fill="#f5e9c4"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- ② 朱砂双框 + 内细线 -->
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="url(#vermilion)" stroke-width="7" rx="14"/>
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#7a1f15" stroke-width="1.4" rx="8"/>
  <!-- 角花祥云 -->
  <use href="#cornerCloud" x="36" y="36" width="60" height="60"/>
  <use href="#cornerCloud" x="504" y="36" width="60" height="60" transform="translate(1064 0) scale(-1 1)"/>
  <use href="#cornerCloud" x="36" y="504" width="60" height="60" transform="translate(0 1068) scale(1 -1)"/>
  <use href="#cornerCloud" x="504" y="504" width="60" height="60" transform="translate(1064 1068) scale(-1 -1)"/>

  <!-- ③ 圆形牌饰（medallion） -->
  <circle cx="300" cy="270" r="205" fill="url(#medallion)" stroke="#3a2618" stroke-width="3"/>
  <circle cx="300" cy="270" r="197" fill="none"      stroke="#3a2618" stroke-width="0.9"/>
  <circle cx="300" cy="270" r="190" fill="none"      stroke="#a17a30" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- ④ 顶部祥云带（medallion 内上方） -->
  <g opacity="0.85">
    <path d="M180 130 Q210 110 245 122 Q260 100 295 112 Q310 92 340 110 Q360 98 388 120 Q420 112 420 140
             Q420 152 405 152 Q380 156 360 148 Q335 158 305 148 Q280 158 250 148 Q220 156 200 148
             Q180 150 180 140 Z"
          fill="url(#cloud)" stroke="#7a5a22" stroke-width="1.2"/>
    <path d="M225 122 q12 -10 26 0" fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M290 110 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
    <path d="M355 118 q12 -10 26 0"  fill="none" stroke="#7a5a22" stroke-width="1"/>
  </g>

  <!-- ⑤ 主体：蚯蚓盘曲于土堆与落叶上，体节密布
        居中于 (300, 285)，约占 360x300 -->
  <g transform="translate(300 285)" stroke="#1d1308" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 土壤/落叶堆（底座） -->
    <g stroke-width="2.4" fill="#fbf2d6">
      <!-- 土堆轮廓 -->
      <path d="M -150 110
               Q -120  90  -80 100
               Q  -40 116    0 102
               Q   40  90   80 100
               Q  120 110  150 100"/>
      <!-- 土粒点 -->
      <g fill="#1d1308" stroke="none" opacity="0.7">
        <circle cx="-100" cy="104" r="1.6"/>
        <circle cx=" -70" cy="110" r="1.4"/>
        <circle cx=" -36" cy="108" r="1.6"/>
        <circle cx="  20" cy="106" r="1.4"/>
        <circle cx="  60" cy="110" r="1.6"/>
        <circle cx=" 100" cy="106" r="1.4"/>
        <circle cx="-130" cy="110" r="1.4"/>
        <circle cx=" 130" cy="108" r="1.4"/>
      </g>

      <!-- 落叶（左下） -->
      <g transform="translate(-120 70)">
        <path d="M -22 0
                 C -22 -12  -10 -18    4 -14
                 C  18 -10  24   4   18  14
                 C  12  22  -2  22  -14  14
                 C -22   8  -22   0  -22  0 Z" stroke-width="2"/>
        <!-- 叶脉 -->
        <path d="M -18 0 q 16 -2 32 6" stroke-width="1.2"/>
        <path d="M -10 -8 q 12 4 18 10" stroke-width="1" opacity="0.7"/>
        <path d="M -6  10 q 10 -4 14 -8" stroke-width="1" opacity="0.7"/>
      </g>

      <!-- 落叶（右下） -->
      <g transform="translate(110 78)">
        <path d="M -22 0
                 C -22 -12  -10 -18    4 -14
                 C  18 -10  24   4   18  14
                 C  12  22  -2  22  -14  14
                 C -22   8  -22   0  -22  0 Z" stroke-width="2"/>
        <path d="M -18 0 q 16 -2 32 6" stroke-width="1.2"/>
        <path d="M -10 -8 q 12 4 18 10" stroke-width="1" opacity="0.7"/>
        <path d="M -6  10 q 10 -4 14 -8" stroke-width="1" opacity="0.7"/>
      </g>
    </g>

    <!-- 蚯蚓身躯：S 形主轮廓（头在右上，尾在左下，穿过中部） -->
    <!-- 主轮廓 -->
    <path d="M  120 -80
             C  150 -50  140  -10  100   0
             C   50  14  -10    8  -50  30
             C  -90  50  -130  30  -150  60"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 同一躯干的另一侧轮廓（闭合） -->
    <path d="M -150  60
             C -120  44  -90  62  -50  44
             C  -10  28   40  32   80  20
             C 120   6  140 -36  120 -70"
          stroke-width="3.6" fill="#fbf2d6"/>

    <!-- 头端（右上） -->
    <g transform="translate(118 -78)">
      <!-- 头部（略尖） -->
      <path d="M -8 -10
               C -2 -16   8 -16  12 -10
               C 16  -2  16   6   8  10
               C -2  12  -8   4  -8 -10 Z"
            stroke-width="3" fill="#fbf2d6"/>
      <!-- 口（蚯蚓口在前缘） -->
      <path d="M 10 -6 q 4 4 0 8" stroke-width="1.6"/>
      <!-- 眼点（很小，蚯蚓对光敏感） -->
      <circle cx="-2" cy="-6" r="0.9" fill="#1d1308"/>
      <circle cx=" 4" cy="-4" r="0.9" fill="#1d1308"/>
    </g>

    <!-- 尾端（左下） -->
    <g transform="translate(-148 60)">
      <path d="M -8 0
               C -4  -6   6 -6  10  0
               C 12   4   8   8   0   8
               C -6   8 -10   4  -8   0 Z"
            stroke-width="2.6" fill="#fbf2d6"/>
      <!-- 尾尖一道纹 -->
      <path d="M -4 0 q 4 -2 8 0" stroke-width="1.2"/>
    </g>

    <!-- 体节环纹（密集弧线，沿身长均匀分布） -->
    <g stroke-width="1.4" opacity="0.95">
      <!-- 右段（头部附近） -->
      <path d="M 130 -64 q -8 6 -2 14"/>
      <path d="M 122 -52 q -8 4 -2 14"/>
      <path d="M 116 -38 q -10 4 -4 14"/>
      <path d="M 108 -22 q -10 2 -4 12"/>
      <path d="M  98  -6 q -12 0 -6 12"/>
      <path d="M  84   6 q -14 0 -8 12"/>
      <path d="M  66  14 q -16 -2 -10 10"/>
      <!-- 中段（横向穿过） -->
      <path d="M  44  18 q -18 -4 -12 8"/>
      <path d="M  22  22 q -18 -4 -12 6"/>
      <path d="M   0  24 q -18 -2 -12 4"/>
      <path d="M -22  26 q -16 -2 -10 4"/>
      <path d="M -42  30 q -16  0 -10 6"/>
      <path d="M -62  36 q -16  2 -10 8"/>
      <!-- 左段（尾部附近） -->
      <path d="M -82  44 q -16  4 -8 12"/>
      <path d="M -102 50 q -16  6 -6 14"/>
      <path d="M -120 56 q -16  6 -4 14"/>
      <path d="M -134 60 q -12  6  0 12"/>

      <!-- 下侧对应一组（与上面错开，呈锯齿状） -->
      <path d="M 120 -56 q 10 4 4 14"/>
      <path d="M 112 -42 q 10 2 4 14"/>
      <path d="M 104 -26 q 10 0 4 14"/>
      <path d="M  94 -10 q 12 0 6 14"/>
      <path d="M  78   2 q 14 -2 8 14"/>
      <path d="M  58  10 q 14 -4 8 12"/>
      <path d="M  36  14 q 16 -6 10 10"/>
      <path d="M  14  18 q 16 -6 10 8"/>
      <path d="M  -8  20 q 16 -6 10 6"/>
      <path d="M -30  22 q 16 -4 10 4"/>
      <path d="M -52  26 q 16 -2 10 6"/>
      <path d="M -74  32 q 16  0 10 8"/>
      <path d="M -94  40 q 16  4 8 10"/>
      <path d="M -114 48 q 16  6 4 12"/>
    </g>

    <!-- 一道细湿润光泽（暗示蚯蚓体表） -->
    <g stroke="#3a2618" stroke-width="0.9" opacity="0.6">
      <path d="M  60  -40 q 30 20  -10 50 q -30 22  -60 60"/>
    </g>

    <!-- 几粒小水珠（点缀蚯蚓出土之湿） -->
    <g fill="#1d1308" stroke="none" opacity="0.85">
      <circle cx=" 70" cy="-46" r="1.4"/>
      <circle cx=" 20" cy=" 10" r="1.6"/>
      <circle cx="-40" cy=" 38" r="1.4"/>
      <circle cx="-90" cy=" 58" r="1.6"/>
    </g>
  </g>

  <!-- ⑥ 题款区（medallion 下方） -->
  <text x="300" y="510" text-anchor="middle" font-size="44" fill="#3a2618" font-weight="bold" letter-spacing="6">轸水蚓</text>
  <text x="300" y="545" text-anchor="middle" font-size="20" fill="#7a1f15" letter-spacing="3">五行属水　|　神兽为蚓</text>
  <text x="300" y="572" text-anchor="middle" font-size="15" fill="#a8362a" letter-spacing="14">南　方　朱　雀　七　宿</text>

  <!-- ⑦ 钤印（朱文方印，轸宿小章）-->
  <g transform="translate(522 540)">
    <rect x="-22" y="-22" width="44" height="44" fill="#a8362a" stroke="#7a1f15" stroke-width="1.4"/>
    <text x="0" y="-2"  text-anchor="middle" font-size="18" fill="#fbf2d6" font-weight="bold">轸</text>
    <text x="0" y="18"  text-anchor="middle" font-size="14" fill="#fbf2d6">宿</text>
  </g>
</svg>
